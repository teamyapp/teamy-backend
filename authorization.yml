    operations:
      - Read
      - Update
      - Delete
  - resourceType: Team
    operations:
      # Team
      - Read
      - Update # Update team settings
      - Delete
      # Task under backlog
      - ReadTask
      - CreateTask
      - UpdateTask
      - DeleteTask
      # Member
      - AddMemberTo
      - RemoveMemberFrom
      # Sprint
      - ReadSprint
      - CreateSprint
      - UpdateSprint
      - DeleteSprint
      # Invitation
      - ReadInvitation
      - CreateInvitation
      - UpdateInvitation
      - DeleteInvitation
  - resourceType: Sprint
    operations:
      - Read
      - Update
      - Delete
  - resourceType: Invitation
    operations:
      - Read
      - Create
      - Delete
