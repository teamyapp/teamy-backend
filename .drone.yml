kind: pipeline
type: kubernetes
name: feature

steps:
  - name: Run unit tests
    image: golang:1.18
    commands:
      - go test ./app/...
  - name: slack
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: code
    when:
      status: [ success, failure ]
trigger:
  branch:
    - master
    - main
  event:
    - pull_request
---
kind: pipeline
type: kubernetes
name: testing

steps:
  - name: build app
    image: golang:1.18-alpine
    commands:
      - apk add --no-cache git
      - go build -o bin/main main.go
      - sh ./scripts/prepare_env.sh
  - name: build & publish Docker image
    image: plugins/docker
    settings:
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      repo: registry.digitalocean.com/teamyapp/teamy-backend-testing
      registry: registry.digitalocean.com
      target: production
      cache_from: registry.digitalocean.com/teamyapp/teamy-backend-testing
  - name: notify image update
    image: plugins/webhook
    settings:
      urls: http://keel.keel.svc.cluster.local:9300/v1/webhooks/native
      template: |
        {
          "name": "registry.digitalocean.com/teamyapp/teamy-backend-testing",
          "tag": "latest"
        }
  - name: slack
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: code
    when:
      status: [ success, failure ]
trigger:
  branch:
    - testing
  event:
    - push
