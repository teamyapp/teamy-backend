kind: pipeline
type: kubernetes
name: feature

steps:
  - name: restore cache
    image: meltwater/drone-cache
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: SPACE_ACCESS_KEY
      AWS_SECRET_ACCESS_KEY:
        from_secret: SPACE_SECRET
    settings:
      endpoint: https://sfo3.digitaloceanspaces.com
      bucket: teamyapp
      region: sfo3
      restore: true
      remote_root: cache
      local_root: /
      cache_key: go
      mount:
        - /go/pkg/mod
  - name: run unit tests
    image: golang:1.18
    volumes:
      - name: cache
        path: /go/pkg/mod
    commands:
      - go test ./...
  - name: rebuild cache
    image: meltwater/drone-cache
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: SPACE_ACCESS_KEY
      AWS_SECRET_ACCESS_KEY:
        from_secret: SPACE_SECRET
    volumes:
      - name: cache
        path: /go/pkg/mod
    settings:
      endpoint: https://sfo3.digitaloceanspaces.com
      bucket: teamyapp
      region: sfo3
      rebuild: true
      override: true
      remote_root: cache
      cache_key: go
      mount:
        - /go/pkg/mod
  - name: slack
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: code
    when:
      status: [ success, failure ]
volumes:
  - name: cache
    temp: {}
trigger:
  branch:
    - master
    - main
  event:
    - pull_request
---
kind: pipeline
type: kubernetes
name: testing

steps:
  - name: restore cache
    image: meltwater/drone-cache
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: SPACE_ACCESS_KEY
      AWS_SECRET_ACCESS_KEY:
        from_secret: SPACE_SECRET
    settings:
      endpoint: https://sfo3.digitaloceanspaces.com
      bucket: teamyapp
      region: sfo3
      restore: true
      remote_root: cache
      local-root: /go/pkg
      cache_key: go
      mount:
        - mod
  - name: build app
    image: golang:1.18-alpine
    commands:
      - apk add --no-cache git
      - go build -o bin/main main.go
      - sh ./scripts/prepare_env.sh
  - name: build & publish Docker image
    image: plugins/docker
    volumes:
      - name: cache
        path: /go/pkg/mod
    settings:
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      repo: registry.digitalocean.com/teamyapp/teamy-backend-testing
      registry: registry.digitalocean.com
      target: production
      cache_from: registry.digitalocean.com/teamyapp/teamy-backend-testing
  - name: notify image update
    image: plugins/webhook
    settings:
      urls: http://keel.keel.svc.cluster.local:9300/v1/webhooks/native
      template: |
        {
          "name": "registry.digitalocean.com/teamyapp/teamy-backend-testing",
          "tag": "latest"
        }
  - name: rebuild cache
    image: meltwater/drone-cache
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: SPACE_ACCESS_KEY
      AWS_SECRET_ACCESS_KEY:
        from_secret: SPACE_SECRET
    volumes:
      - name: cache
        path: /go/pkg/mod
    settings:
      endpoint: https://sfo3.digitaloceanspaces.com
      bucket: teamyapp
      region: sfo3
      rebuild: true
      override: false
      remote_root: cache
      local-root: /go/pkg
      cache_key: go
      mount:
        - mod
  - name: slack
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: code
    when:
      status: [ success, failure ]
volumes:
  - name: cache
    temp: {}
trigger:
  branch:
    - testing
  event:
    - push
