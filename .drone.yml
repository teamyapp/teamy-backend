kind: pipeline
type: kubernetes
name: testing

steps:
  - name: build image
    image: plugins/docker
    settings:
      repo: harbor.internal.teamyapp.com/internal/teamy-backend-testing
      registry: harbor.internal.teamyapp.com
      target: production
      cache_from: harbor.internal.teamyapp.com/internal/teamy-backend-testing
trigger:
  branch:
    - testing
  event:
    - push
---
kind: pipeline
type: kubernetes
name: feature

steps:
  - name: Run unit tests
    image: golang:1.17
    commands:
      - go mod download
      - go test ./...
trigger:
  branch:
    - master
    - main
  event:
    - pull_request
---
kind: pipeline
type: kubernetes
name: staging

steps:
  - name: build image
    image: plugins/docker
    settings:
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      repo: harbor.internal.teamyapp.com/internal/teamy-backend-staging
      registry: harbor.internal.teamyapp.com
      target: production
      cache_from: harbor.internal.teamyapp.com/internal/teamy-backend-staging
trigger:
  branch:
    - master
    - main
  event:
    - push
---
kind: pipeline
type: kubernetes
name: production

steps:
  - name: build image
    image: plugins/docker
    settings:
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      repo: harbor.internal.teamyapp.com/internal/teamy-backend
      registry: harbor.internal.teamyapp.com
      target: production
      cache_from: harbor.internal.teamyapp.com/internal/teamy-backend-staging
trigger:
  branch:
    - production
  event:
    - push
