kind: pipeline
type: kubernetes
name: testing

steps:
  - name: build image
    image: plugins/docker
    settings:
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      repo: registry.digitalocean.com/teamyapp/teamy-backend-testing
      registry: registry.digitalocean.com
      target: production
      cache_from: registry.digitalocean.com/teamyapp/teamy-backend-testing
trigger:
  branch:
    - testing
  event:
    - push
---
kind: pipeline
type: kubernetes
name: feature

steps:
  - name: Run unit tests
    image: golang:1.17
    commands:
      - go test ./...
trigger:
  branch:
    - master
    - main
  event:
    - pull_request
---
kind: pipeline
type: kubernetes
name: staging

steps:
  - name: build image
    image: plugins/docker
    environment:
    settings:
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      repo: registry.digitalocean.com/teamyapp/teamy-backend-staging
      registry: registry.digitalocean.com
      target: production
      cache_from: registry.digitalocean.com/teamyapp/teamy-backend-staging
trigger:
  branch:
    - master
    - main
  event:
    - push
---
kind: pipeline
type: kubernetes
name: production

steps:
  - name: build image
    image: plugins/docker
    settings:
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      repo: registry.digitalocean.com/teamyapp/teamy-backend
      registry: registry.digitalocean.com
      target: production
      cache_from: registry.digitalocean.com/teamyapp/teamy-backend
trigger:
  branch:
    - production
  event:
    - push
