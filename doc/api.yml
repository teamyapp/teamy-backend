openapi: "3.0.0"
info:
  title: "User Management API"
  version: "1.0.0"
  description: "An API to manage users."
paths:
  /users:
    post:
      summary: "Create a new user"
      description: "Creates a new user and returns the created user."
      requestBody:
        description: "User object to be created"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "201":
          description: "User created successfully."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: "Invalid input."
    get:
      summary: "Get all users"
      description: "Returns a list of all users."
      responses:
        "200":
          description: "A list of users."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/User"
  /users/{id}:
    get:
      summary: "Get user by ID"
      description: "Returns a single user by ID."
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
      responses:
        "200":
          description: "A single user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: "User not found."
    put:
      summary: "Update user by ID"
      description: "Updates a user by ID and returns the updated user."
      parameters:
        - name: "id"
          in: "fpath"
          required: true
          schema:
            type: "integer"
      requestBody:
        description: "User object to be updated"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: "User updated successfully."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: "Invalid input."
        "404":
          description: "User not found."
    delete:
      summary: "Delete user by ID"
      description: "Deletes a user by ID."
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
      responses:
        "204":
          description: "User deleted successfully."
        "404":
          description: "User not found."
components:
  schemas:
    User:
      type: "object"
      required:
        - "name"
        - "email"
      properties:
        id:
          type: "integer"
          example: 1
        name:
          type: "string"
          example: "John Doe"
        email:
          type: "string"
          example: "john.doe@example.com"
        age:
          type: "integer"
          example: 30
