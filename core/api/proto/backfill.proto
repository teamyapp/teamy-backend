syntax = "proto3";

import "google/protobuf/empty.proto";

option go_package = "github.com/teamy-backend/core/api/proto";

service BackFill {
	rpc BackFillParticipantsBandwidth(BackFillParticipantsBandwidthRequest) returns (google.protobuf.Empty);
}

message BackFillParticipantsBandwidthRequest {
	optional uint64 teamId = 1;
	optional uint64 sprintId = 2;
}
