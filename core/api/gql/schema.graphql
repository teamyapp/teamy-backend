schema {
	query: Query
	mutation: Mutation
}

type Query {
	me: User!
	tasks(filter: TaskFilter): [Task!]!
	teams(filter: TeamFilter): [Team!]!
	invitations(filter: InvitationFilter): [Invitation!]!
	sprints(filter: SprintFilter): [Sprint!]!
	apps(filter: AppFilter): [App!]!
}

type Mutation {
	# Task
	createTask(teamId: ID!, task: CreateTaskInput!): Task!
	updateTask(taskId: ID!, input: UpdateTaskInput!): Task!
	deleteTask(taskId: ID!): Task!
	moveTaskToUpcoming(taskId: ID!): Task!
	moveTaskToInProgress(taskId: ID!): Task!
	moveTaskToDelivered(taskId: ID!): Task!
	moveTaskToBlocked(taskId: ID!, reason: String!): Task!
	addAwaitForTask(taskId: ID!, awaitForTaskId: ID!): Task!
	removeAwaitForTask(taskId: ID!, awaitForTaskId: ID!): Task!
	startDraggingTask(taskId: ID!, clientId: ID!): ID!
	stopDraggingTask(taskId: ID!, clientId: ID!): ID!

	# Message
	createMessage(threadId: ID!, message: CreateMessageInput!): Message!
	updateMessage(messageId: ID!, input: UpdateMessageInput!): Message!
	deleteMessage(messageId: ID!): Message!

	# Team
	createTeam(team: CreateTeamInput!): Team!
	updateTeam(teamId: ID!, input: UpdateTeamInput!): Team!
	updateTeamActiveSprint(teamId: ID!, sprintId: ID!): Team!
	createTeamIconUploadSession(teamId: ID!): ID!
	finishTeamIconUploadSession(teamId: ID!, fileUploadSessionId: ID!): Team!
	addMemberToTeam(teamId: ID!, memberUserId: ID!): TeamMember!
	updateTeamMember(teamId: ID!, input: UpdateTeamMemberInput!): TeamMember!
	removeMemberFromTeam(teamId: ID!, memberUserId: ID!): TeamMember!
	deleteTeam(teamId: ID!): Team!

	# User
	createUser(user: CreateUserInput!): User!
	updateUser(userId: ID!, input: UpdateUserInput!): User!
	createUserProfileUploadSession: ID!
	finishUserProfileUploadSession(fileUploadSessionId: ID!): User!

	# Invitation
	createInvitation(
		teamId: ID!
		invitation: CreateInvitationInput!
	): Invitation!
	updateInvitation(
		invitationId: ID!
		input: UpdateInvitationInput!
	): Invitation!
	acceptInvitation(invitationId: ID!, invitationCode: String!): Invitation!
	declineInvitation(invitationId: ID!, invitationCode: String!): Invitation!
	deleteInvitation(invitationId: ID!): Invitation!

	# Sprint
	createSprint(teamId: ID!, sprint: CreateSprintInput!): Sprint!
	deleteSprint(sprintId: ID!): Sprint!
	addTaskToSprint(sprintId: ID!, taskId: ID!): Task!
	removeTaskFromSprint(sprintId: ID!, taskId: ID!): Task!
	moveTasksToSprint(
		fromSprintId: ID!
		toSprintId: ID!
		taskIds: [ID!]!
	): [Task!]!
	copyTasksToSprint(toSprintId: ID!, taskIds: [ID!]!): [Task!]!

	# File
	createFileUploadSession(teamId: ID!): ID!
	finishFileUploadSession(fileUploadSessionId: ID!): FileMetadata!
	updateFileMetadata(fileId: ID!, input: FileMetadataInput!): FileMetadata!
	deleteFile(fileId: ID!): FileMetadata!

	# App
	createApp(teamId: ID!, name: String!): App!
	deleteApp(appId: ID!): App!
	installAppToTeam(appId: ID!, teamId: ID!): TeamAppInstallation!
	uninstallAppFromTeam(installationId: ID!): TeamAppInstallation!

	createAppSecret(appId: ID!, input: CreateAppSecretInput!): AppSecret!
	updateAppSecret(secretId: ID!, input: UpdateAppSecretInput!): AppSecret!
	deleteAppSecret(secretId: ID!): AppSecret!

	createAppVersion(appId: ID!): AppVersion!
	createAppPackageUploadSession(appId: ID!, versionNumber: Int!): ID!
	finishAppPackageUploadSession(
		appId: ID!
		versionNumber: Int!
		fileUploadSessionId: ID!
	): AppVersion!
	deleteAppVersion(appId: ID!, versionNumber: Int!): AppVersion!

	createStaticUserGroup(appId: ID!, input: CreateStaticUserGroupInput!): StaticUserGroup!
	updateStaticUserGroup(groupId: ID!,input: UpdateStaticUserGroupInput!): StaticUserGroup!
	createFilterUserGroup(appId: ID!, input: CreateFilterUserGroupInput!): FilterGroup!
	createStaticTeamGroup(appId: ID!, input: CreateStaticTeamGroupInput!): StaticTeamGroup!
	updateStaticTeamGroup(groupId: ID!,input: UpdateStaticTeamGroupInput!): StaticTeamGroup!
	createFilterTeamGroup(appId: ID!, input: CreateFilterTeamGroupInput!): FilterGroup!
	
	updateFilterGroup(groupId: ID!, input: UpdateFilterGroupInput!): FilterGroup!
	deleteGroup(groupId: ID!): Group!

	createTimeRangeActivator(input: CreateTimeRangeActivatorInput!): TimeRangeActivator!
	createMaxViewersActivator(input: CreateMaxViewersActivatorInput!): MaxViewersActivator!
	createPercentageActivator(input: CreatePercentageActivatorInput!): PercentageActivator!

	createStaticVersionSelector(input: CreateStaticVersionSelectorInput!): VersionSelector!
	createExperimentVersionSelector(input: CreateExperimentVersionSelectorInput!): VersionSelector!

	createAppRollout(appID: ID!, appRolloutType: AppRolloutType!, input: CreateRolloutInput!): Rollout!
	updateRollout(rolloutId: ID!, input: UpdateRolloutInput!): Rollout!
	deleteRollout(rolloutId: ID!): Rollout!
}

type Task {
	id: ID!
	goal: String!
	context: String
	creator: User!
	owner: User
	owningTeam: Team!
	status: TaskStatus!
	isPlanned: Boolean!
	comments: Thread!
	createdAt: Time!
	updatedAt: Time
	deliveredAt: Time
	dueAt: Time
	effort: Duration
	availableActions: [TaskAction!]!
	awaitForTasks: [Task!]!
	links: [TaskLink!]!
}

type TaskLink {
	id: ID!
	taskId: ID!
	title: String!
	url: String!
	iconUrl: String
	iconHoverUrl: String
	createdAt: Time!
	updatedAt: Time
}

type Message {
	id: ID!
	body: String!
	author: User!
	thread: Thread!
	createdAt: Time!
	updatedAt: Time
}


type Thread {
	id: ID!
	messages: [Message!]!
}

type Sprint {
	id: ID!
	startAt: Time!
	endAt: Time!
	owningTeam: Team!
	tasks(filter: TaskFilter): [Task!]!
	createdAt: Time!
	participants: [SprintParticipant!]!
}

type SprintParticipant {
	sprint: Sprint!
	user: User!
	totalBandwidth: Duration!
	unusedBandwidth: Duration!
	createdAt: Time!
	updatedAt: Time
}

type Team {
	id: ID!
	name: String!
	iconUrl: String
	createdAt: Time!
	creator: User!
	owner: User!
	members: [TeamMember!]!
	tasks(filter: TaskFilter): [Task!]!
	invitations(filter: InvitationFilter): [Invitation!]!
	sprints(filter: SprintFilter): [Sprint!]!
	appInstallations: [TeamAppInstallation!]!
	managedApps: [App!]!
	taskActivities: [TaskActivity!]!
	activeSprint: Sprint
}

type TeamMember {
	team: Team!
	user: User!
	weeklyBandwidth: Duration!
	createdAt: Time!
	updatedAt: Time
}

type TaskActivity {
	taskId: ID!
	dragTaskActivity: DragTaskActivity!
}

type DragTaskActivity {
	isDragging: Boolean!
	client: Client
}

type Client {
	id: ID!
	user: User!
}

type Invitation {
	id: ID!
	sender: User!
	receiverFirstName: String
	receiverLastName: String
	receiverEmail: String
	receiver: User
	joiningTeam: Team!
	expireAt: Time!
	createdAt: Time!
	updatedAt: Time
	status: InvitationStatus!
	code: String!
}

type FileMetadata {
	id: ID!
	name: String!
	createdAt: Time!
	lastModifiedAt: Time
	owningTeam: Team!
}

type User {
	id: ID!
	firstName: String!
	lastName: String!
	profileUrl: String
	createdAt: Time!
	updatedAt: Time
	teams(filter: TeamFilter): [Team!]!
}

type Rollout {
	id: ID!
	activator: Activator!
	versionSelector: VersionSelector!
	isEnabled: Boolean!
}

interface Activator {
	id: ID!
	createdAt: Time!
	updatedAt: Time
}

type TimeRangeActivator implements Activator {
	id: ID!
	startAt: Time
	endAt: Time
	createdAt: Time!
	updatedAt: Time
}

type VersionSelector {
	id: ID!
	type: VersionSelectorType!
	versionNumbers: [Int!]!
}

type MaxViewersActivator implements Activator {
	id: ID!
	maxViewers: Int!
	createdAt: Time!
	updatedAt: Time
}

type PercentageActivator implements Activator {
	id: ID!
	percentage: Int!
	createdAt: Time!
	updatedAt: Time
}

type App {
	id: ID!
	secrets: [AppSecret!]!
	totalInstallations: Int!
	installations: [TeamAppInstallation!]!
	versions: [AppVersion!]!
	userGroups: [Group!]!
	teamGroups: [Group!]!
	userRollouts: [Rollout!]!
	teamRollouts: [Rollout!]!
	managedByTeam: Team!
}

type AppSecret {
	id: ID!
	name: String!
	addedAt: Time!
	addedBy: User!
	lastUsedAt: Time
	app: App!
}

type AppVersion {
	number: Int!
	appName: String!
	description: String!
	changes: [String!]!
	createdAt: Time!
	createdBy: User!
	prices: [Money!]!
	isReady: Boolean!
	app: App!
}

interface Group {
	id: ID!
	type: GroupType!
	name: String!
	createdAt: Time!
	updatedAt: Time
	rollouts: [Rollout!]!
}

type StaticUserGroup implements Group { 
	id: ID!
	type: GroupType!
	name: String!
	users: [User!]!
	createdAt: Time!
	updatedAt: Time
	rollouts: [Rollout!]!
}

type StaticTeamGroup implements Group {
	id: ID!
	type: GroupType!
	name: String!
	teams: [Team!]!
	createdAt: Time!
	updatedAt: Time
	rollouts: [Rollout!]!
}

type FilterGroup implements Group {
	id: ID!
	type: GroupType!
	name: String!
	filter: String!
	memberCount: Int!
	createdAt: Time!
	updatedAt: Time
	rollouts: [Rollout!]!
}

type TeamAppInstallation {
	id: ID!
	installedTeam: Team!
	activeAppVersion: AppVersion
}

type Money {
	currency: Currency!
	amount: Int!
}

# Filters
input TaskFilter {
	taskId: ID
	ownerId: ID
	goalContains: String
	status: TaskStatus
	isPlanned: Boolean
}

input TeamFilter {
	teamId: ID
}

input InvitationFilter {
	invitationId: ID
	code: String
}

input SprintFilter {
	sprintId: ID
	startAtAndAfter: Time
	sortByStartAt: Boolean
	countLimit: Int
}

input AppFilter {
	query: String
	tag: String
	isOnPromotion: Boolean
}

# Inputs
input CreateTaskInput {
	goal: String!
	context: String
	ownerUserId: ID
	dueAt: Time
	isPlanned: Boolean!
}

input UpdateTaskInput {
	goal: String!
	context: String
	ownerUserId: ID
	owningTeamId: ID!
	effort: Duration
	dueAt: Time
}

input CreateMessageInput {
	body: String!
}

input UpdateMessageInput {
	body: String!
}

input CreateTeamInput {
	name: String!
}

input UpdateTeamInput {
	name: String!
	ownerUserId: ID!
}

input UpdateTeamMemberInput {
	userId: ID!
	weeklyBandwidth: Duration!
}

input CreateUserInput {
	lastName: String!
	firstName: String!
	profileUrl: String
}

input UpdateUserInput {
	lastName: String!
	firstName: String!
}

input CreateInvitationInput {
	receiverFirstName: String
	receiverLastName: String
	receiverEmail: String
	expireAt: Time!
}

input UpdateInvitationInput {
	receiverFirstName: String
	receiverLastName: String
	expireAt: Time!
}

input CreateSprintInput {
	startAt: Time!
	endAt: Time!
}

input FileMetadataInput {
	name: String!
}

input CreateAppSecretInput {
	name: String!
}

input UpdateAppSecretInput {
	name: String!
}

input CreateStaticUserGroupInput {
	name: String!
	userIds: [ID!]!
}

input UpdateStaticUserGroupInput {
	name: String!
	userIds: [ID!]!
}

input CreateFilterUserGroupInput {
	name: String!
	filter: String!
}

input UpdateFilterGroupInput {
	name: String!
	filter: String!
}

input CreateStaticTeamGroupInput {
	name: String!
	teamIds: [ID!]!
}

input UpdateStaticTeamGroupInput {
	name: String!
	teamIds: [ID!]!
}

input CreateFilterTeamGroupInput {
	name: String!
	filter: String!
}

input CreateTimeRangeActivatorInput {
	startAt: Time
	endAt: Time
}

input CreateMaxViewersActivatorInput {
	maxViewers: Int!
}

input CreatePercentageActivatorInput {
	percentage: Int!
}

input CreateRolloutInput {
	activatorID:  ID!
	versionSelectorID: ID!
	isEnabled:     Boolean!
}

input UpdateRolloutInput {
	activatorID:  ID!
	versionSelectorID:  ID!
	isEnabled:     Boolean!
}

input CreateStaticVersionSelectorInput {
	versionNumber: Int!
}

input CreateExperimentVersionSelectorInput {
	versionNumbers: [Int!]!
}

enum InvitationStatus {
	PENDING
	ACCEPTED
	DECLINED
	EXPIRED
}

enum TaskAction {
	START
	DELETE
	ASSIGN_OWNER
	REPORT_BLOCKED
	MARK_COMPLETE
}

enum TaskStatus {
	TODO
	IN_PROGRESS
	PAUSED
	AWAITING
	BLOCK
	DELIVERED
}

enum Currency {
	USD
}

enum GroupType {
	STATIC
	FILTER
}

enum AppRolloutType {
	USER
	TEAM
}

enum ActivatorType {
	TIME_RANGE
	MAX_VIEWERS
	PERCENTAGE
}

enum VersionSelectorType {
	STATIC
	EXPERIMENT
}

scalar Duration

scalar Time
