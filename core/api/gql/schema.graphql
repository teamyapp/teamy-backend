schema {
	query: Query
	mutation: Mutation
}

type Query {
	me: User!
	tasks(filter: TaskFilter): [Task!]!
	teams(filter: TeamFilter): [Team!]!
	invitations(filter: InvitationFilter): [Invitation!]!
	sprints(filter: SprintFilter): [Sprint!]!
	apps(filter: AppFilter): [App!]!
}

type Mutation {
	# Task
	createTask(teamId: ID!, task: CreateTaskInput!): Task!
	updateTask(taskId: ID!, input: UpdateTaskInput!): Task!
	deleteTask(taskId: ID!): Task!
	moveTaskToUpcoming(taskId: ID!): Task!
	moveTaskToInProgress(taskId: ID!): Task!
	moveTaskToDelivered(taskId: ID!): Task!
	moveTaskToBlocked(taskId: ID!, reason: String!): Task!
	addAwaitForTask(taskId: ID!, awaitForTaskId: ID!): Task!
	removeAwaitForTask(taskId: ID!, awaitForTaskId: ID!): Task!
	startDraggingTask(taskId: ID!, clientId: ID!): ID!
	stopDraggingTask(taskId: ID!, clientId: ID!): ID!

	# Message
	createMessage(threadId: ID!, message: CreateMessageInput!): Message!
	updateMessage(messageId: ID!, input: UpdateMessageInput!): Message!
	deleteMessage(messageId: ID!): Message!

	# Team
	createTeam(team: CreateTeamInput!): Team!
	updateTeam(teamId: ID!, input: UpdateTeamInput!): Team!
	updateTeamActiveSprint(teamId: ID!, sprintId: ID!): Team!
	createTeamIconUploadSession(teamId: ID!): ID!
	finishTeamIconUploadSession(teamId: ID!, fileUploadSessionId: ID!): Team!
	addMemberToTeam(teamId: ID!, memberUserId: ID!): TeamMember!
	updateTeamMember(teamId: ID!, input: UpdateTeamMemberInput!): TeamMember!
	removeMemberFromTeam(teamId: ID!, memberUserId: ID!): TeamMember!
	deleteTeam(teamId: ID!): Team!

	# User
	createUser(user: CreateUserInput!): User!
	updateUser(userId: ID!, input: UpdateUserInput!): User!
	createUserProfileUploadSession: ID!
	finishUserProfileUploadSession(fileUploadSessionId: ID!): User!

	# Invitation
	createInvitation(
		teamId: ID!
		invitation: CreateInvitationInput!
	): Invitation!
	updateInvitation(
		invitationId: ID!
		input: UpdateInvitationInput!
	): Invitation!
	acceptInvitation(invitationId: ID!, invitationCode: String!): Invitation!
	declineInvitation(invitationId: ID!, invitationCode: String!): Invitation!
	deleteInvitation(invitationId: ID!): Invitation!

	# Sprint
	createSprint(teamId: ID!, sprint: CreateSprintInput!): Sprint!
	deleteSprint(sprintId: ID!): Sprint!
	addTaskToSprint(sprintId: ID!, taskId: ID!): Task!
	removeTaskFromSprint(sprintId: ID!, taskId: ID!): Task!
	moveTasksToSprint(
		fromSprintId: ID!
		toSprintId: ID!
		taskIds: [ID!]!
	): [Task!]!
	copyTasksToSprint(toSprintId: ID!, taskIds: [ID!]!): [Task!]!

	# File
	createFileUploadSession(teamId: ID!): ID!
	finishFileUploadSession(fileUploadSessionId: ID!): FileMetadata!
	updateFileMetadata(fileId: ID!, input: FileMetadataInput!): FileMetadata!
	deleteFile(fileId: ID!): FileMetadata!

	# App
	createApp(teamId: ID!, name: String!): App!
	deleteApp(appId: ID!): App!
	installAppToTeam(appId: ID!, teamId: ID!): TeamAppInstallation!
	uninstallAppFromTeam(installationId: ID!): TeamAppInstallation!

	createAppSecret(appId: ID!, input: CreateAppSecretInput!): AppSecret!
	updateAppSecret(secretId: ID!, input: UpdateAppSecretInput!): AppSecret!
	deleteAppSecret(secretId: ID!): AppSecret!

	createAppVersion(appId: ID!): AppVersion!
	createAppPackageUploadSession(appId: ID!, versionNumber: Int!): ID!
	finishAppPackageUploadSession(
		appId: ID!
		versionNumber: Int!
		fileUploadSessionId: ID!
	): AppVersion!
	deleteAppVersion(appId: ID!, versionNumber: Int!): AppVersion!

	createStaticUserGroup(appId: ID!, input: CreateStaticUserGroupInput!): StaticUserGroup!
	updateStaticUserGroup(groupId: ID!,input: UpdateStaticUserGroupInput!): StaticUserGroup!
	createFilterUserGroup(appId: ID!, input: CreateFilterUserGroupInput!): FilterUserGroup!
	updateFilterUserGroup(groupId: ID!, input: UpdateFilterUserGroupInput!): FilterUserGroup!
	createStaticTeamGroup(appId: ID!, input: CreateStaticTeamGroupInput!): StaticTeamGroup!
	updateStaticTeamGroup(groupId: ID!,input: UpdateStaticTeamGroupInput!): StaticTeamGroup!
	createFilterTeamGroup(appId: ID!, input: CreateFilterTeamGroupInput!): FilterTeamGroup!
	updateFilterTeamGroup(groupId: ID!,input: UpdateFilterTeamGroupInput!): FilterTeamGroup!
	deleteGroup(groupId: ID!): Group!

	createStaticUserRollout(appId: ID!, input: CreateStaticUserRolloutInput!): StaticUserRollout!
	updateStaticUserRollout(rolloutId: ID!,input: UpdateStaticUserRolloutInput!): StaticUserRollout!
	createTimeRangeUserRollout(appId: ID!, input: CreateTimeRangeUserRolloutInput!): TimeRangeUserRollout!
	updateTimeRangeUserRollout(rolloutId: ID!,input: UpdateTimeRangeRolloutInput!): TimeRangeUserRollout!
	createExperimentUserRollout(appId: ID!, input: CreateExperimentUserRolloutInput!): ExperimentUserRollout!
	updateExperimentUserRollout(rolloutId: ID!,input: UpdateExperimentUserRolloutInput!): ExperimentUserRollout!
	createStaticTeamRollout(appId: ID!, input: CreateStaticTeamRolloutInput!): StaticTeamRollout!
	updateStaticTeamRollout(rolloutId: ID!,input: UpdateStaticTeamRolloutInput!): StaticTeamRollout!
	createTimeRangeTeamRollout(appId: ID!, input: CreateTimeRangeTeamRolloutInput!): TimeRangeTeamRollout!
	updateTimeRangeTeamRollout(rolloutId: ID!,input: UpdateTimeRangeTeamRolloutInput!): TimeRangeTeamRollout!
	createExperimentTeamRollout(appId: ID!, input: CreateExperimentTeamRolloutInput!): ExperimentTeamRollout!
	updateExperimentTeamRollout(rolloutId: ID!,input: UpdateExperimentTeamRolloutInput!): ExperimentTeamRollout!
	deleteRollout(rolloutId: ID!): Rollout!
}

type Task {
	id: ID!
	goal: String!
	context: String
	creator: User!
	owner: User
	owningTeam: Team!
	status: TaskStatus!
	isPlanned: Boolean!
	comments: Thread!
	createdAt: Time!
	updatedAt: Time
	deliveredAt: Time
	dueAt: Time
	effort: Duration
	availableActions: [TaskAction!]!
	awaitForTasks: [Task!]!
	links: [TaskLink!]!
}

type TaskLink {
	id: ID!
	taskId: ID!
	title: String!
	url: String!
	iconUrl: String
	iconHoverUrl: String
	createdAt: Time!
	updatedAt: Time
}

type Message {
	id: ID!
	body: String!
	author: User!
	thread: Thread!
	createdAt: Time!
	updatedAt: Time
}


type Thread {
	id: ID!
	messages: [Message!]!
}

type Sprint {
	id: ID!
	startAt: Time!
	endAt: Time!
	owningTeam: Team!
	tasks(filter: TaskFilter): [Task!]!
	createdAt: Time!
	participants: [SprintParticipant!]!
}

type SprintParticipant {
	sprint: Sprint!
	user: User!
	totalBandwidth: Duration!
	unusedBandwidth: Duration!
	createdAt: Time!
	updatedAt: Time
}

type Team {
	id: ID!
	name: String!
	iconUrl: String
	createdAt: Time!
	creator: User!
	owner: User!
	members: [TeamMember!]!
	tasks(filter: TaskFilter): [Task!]!
	invitations(filter: InvitationFilter): [Invitation!]!
	sprints(filter: SprintFilter): [Sprint!]!
	appInstallations: [TeamAppInstallation!]!
	managedApps: [App!]!
	taskActivities: [TaskActivity!]!
	activeSprint: Sprint
}

type TeamMember {
	team: Team!
	user: User!
	weeklyBandwidth: Duration!
	createdAt: Time!
	updatedAt: Time
}

type TaskActivity {
	taskId: ID!
	dragTaskActivity: DragTaskActivity!
}

type DragTaskActivity {
	isDragging: Boolean!
	client: Client
}

type Client {
	id: ID!
	user: User!
}

type Invitation {
	id: ID!
	sender: User!
	receiverFirstName: String
	receiverLastName: String
	receiverEmail: String
	receiver: User
	joiningTeam: Team!
	expireAt: Time!
	createdAt: Time!
	updatedAt: Time
	status: InvitationStatus!
	code: String!
}

type FileMetadata {
	id: ID!
	name: String!
	createdAt: Time!
	lastModifiedAt: Time
	owningTeam: Team!
}

type User {
	id: ID!
	firstName: String!
	lastName: String!
	profileUrl: String
	createdAt: Time!
	updatedAt: Time
	teams(filter: TeamFilter): [Team!]!
}

type App {
	id: ID!
	secrets: [AppSecret!]!
	totalInstallations: Int!
	installations: [TeamAppInstallation!]!
	versions: [AppVersion!]!
	userGroups: [UserGroup!]!
	teamGroups: [TeamGroup!]!
	userRollouts: [UserRollout!]!
	teamRollouts: [TeamRollout!]!
	managedByTeam: Team!
}

type AppSecret {
	id: ID!
	name: String!
	addedAt: Time!
	addedBy: User!
	lastUsedAt: Time
	app: App!
}

type AppVersion {
	number: Int!
	appName: String!
	description: String!
	changes: [String!]!
	createdAt: Time!
	createdBy: User!
	prices: [Money!]!
	isReady: Boolean!
	app: App!
}

interface Group {
	id: ID!
	type: GroupType!
	name: String!
	createdAt: Time!
	updatedAt: Time
}

interface UserGroup implements Group{
	id: ID!
	type: GroupType!
	name: String!
	createdAt: Time!
	updatedAt: Time
	rollouts: [UserRollout!]!
}

interface TeamGroup implements Group{
	id: ID!
	type: GroupType!
	name: String!
	createdAt: Time!
	updatedAt: Time
	rollouts: [TeamRollout!]!
}

type StaticUserGroup implements UserGroup{
	id: ID!
	type: GroupType!
	name: String!
	users: [User!]!
	createdAt: Time!
	updatedAt: Time
	rollouts: [UserRollout!]!
}

type StaticTeamGroup implements TeamGroup{
	id: ID!
	type: GroupType!
	name: String!
	teams: [Team!]!
	createdAt: Time!
	updatedAt: Time
	rollouts: [TeamRollout!]!
}

interface FilterGroup implements Group{
	id: ID!
	type: GroupType!
	name: String!
	filter: String!
	createdAt: Time!
	updatedAt: Time
}

type FilterUserGroup implements FilterGroup, UserGroup{
	id: ID!
	type: GroupType!
	name: String!
	filter: String!
	userCount: Int!
	createdAt: Time!
	updatedAt: Time
	rollouts: [UserRollout!]!
}

type FilterTeamGroup implements FilterGroup, TeamGroup{
	id: ID!
	type: GroupType!
	name: String!
	filter: String!
	teamCount: Int!
	createdAt: Time!
	updatedAt: Time
	rollouts: [TeamRollout!]!
}

interface Rollout {
	id: ID!
	type: RolloutType!
	createdAt: Time!
}

interface UserRollout implements Rollout {
	id: ID!
	type: RolloutType!
	createdAt: Time!
	userGroups: [UserGroup!]!
}

interface TeamRollout implements Rollout{
	id: ID!
	type: RolloutType!
	createdAt: Time!
	teamGroups: [TeamGroup!]!
}

interface StaticRollout implements Rollout{
	id: ID!
	type: RolloutType!
	appVersion: AppVersion!
	createdAt: Time!
}

type StaticUserRollout implements UserRollout, StaticRollout{
	id: ID!
	type: RolloutType!
	appVersion: AppVersion!
	createdAt: Time!
	userGroups: [UserGroup!]!
}

type StaticTeamRollout implements TeamRollout, StaticRollout{
	id: ID!
	type: RolloutType!
	appVersion: AppVersion!
	createdAt: Time!
	teamGroups: [TeamGroup!]!
}

interface TimeRangeRollout implements Rollout{
	id: ID!
	type: RolloutType!
	appVersion: AppVersion!
	startAt: Time
	endAt: Time
	createdAt: Time!
}

type TimeRangeUserRollout implements UserRollout, StaticRollout{
	id: ID!
	type: RolloutType!
	appVersion: AppVersion!
	startAt: Time
	endAt: Time
	createdAt: Time!
	userGroups: [UserGroup!]!
}

type TimeRangeTeamRollout implements TeamRollout, StaticRollout{
	id: ID!
	type: RolloutType!
	appVersion: AppVersion!
	startAt: Time
	endAt: Time
	createdAt: Time!
	teamGroups: [TeamGroup!]!
}

interface ExperimentRollout implements Rollout{
	id: ID!
	type: RolloutType!
	appVersions: [AppVersion!]!
	startAt: Time
	endAt: Time
	createdAt: Time!
}

type ExperimentUserRollout implements UserRollout, ExperimentRollout{
	id: ID!
	type: RolloutType!
	appVersions: [AppVersion!]!
	startAt: Time
	endAt: Time
	createdAt: Time!
	userGroups: [UserGroup!]!
}

type ExperimentTeamRollout implements TeamRollout, ExperimentRollout{
	id: ID!
	type: RolloutType!
	appVersions: [AppVersion!]!
	startAt: Time
	endAt: Time
	createdAt: Time!
	teamGroups: [TeamGroup!]!
}

type TeamAppInstallation {
	id: ID!
	installedTeam: Team!
	activeAppVersion: AppVersion
}

type Money {
	currency: Currency!
	amount: Int!
}

# Filters
input TaskFilter {
	taskId: ID
	ownerId: ID
	goalContains: String
	status: TaskStatus
	isPlanned: Boolean
}

input TeamFilter {
	teamId: ID
}

input InvitationFilter {
	invitationId: ID
	code: String
}

input SprintFilter {
	sprintId: ID
	startAtAndAfter: Time
	sortByStartAt: Boolean
	countLimit: Int
}

input AppFilter {
	query: String
	tag: String
	isOnPromotion: Boolean
}

# Inputs
input CreateTaskInput {
	goal: String!
	context: String
	ownerUserId: ID
	dueAt: Time
	isPlanned: Boolean!
}

input UpdateTaskInput {
	goal: String!
	context: String
	ownerUserId: ID
	owningTeamId: ID!
	effort: Duration
	dueAt: Time
}

input CreateMessageInput {
	body: String!
}

input UpdateMessageInput {
	body: String!
}

input CreateTeamInput {
	name: String!
}

input UpdateTeamInput {
	name: String!
	ownerUserId: ID!
}

input UpdateTeamMemberInput {
	userId: ID!
	weeklyBandwidth: Duration!
}

input CreateUserInput {
	lastName: String!
	firstName: String!
	profileUrl: String
}

input UpdateUserInput {
	lastName: String!
	firstName: String!
}

input CreateInvitationInput {
	receiverFirstName: String
	receiverLastName: String
	receiverEmail: String
	expireAt: Time!
}

input UpdateInvitationInput {
	receiverFirstName: String
	receiverLastName: String
	expireAt: Time!
}

input CreateSprintInput {
	startAt: Time!
	endAt: Time!
}

input FileMetadataInput {
	name: String!
}

input CreateAppSecretInput {
	name: String!
}

input UpdateAppSecretInput {
	name: String!
}

input CreateStaticUserGroupInput {
	name: String!
	userIds: [ID!]!
}

input UpdateStaticUserGroupInput {
	name: String!
	userIds: [ID!]!
}

input CreateFilterUserGroupInput {
	name: String!
	filter: String!
}

input UpdateFilterUserGroupInput {
	name: String!
	filter: String!
}

input CreateStaticTeamGroupInput {
	name: String!
	teamIds: [ID!]!
}

input UpdateStaticTeamGroupInput {
	name: String!
	teamIds: [ID!]!
}

input CreateFilterTeamGroupInput {
	name: String!
	filter: String!
}

input UpdateFilterTeamGroupInput {
	name: String!
	filter: String!
}

input CreateStaticUserRolloutInput {
	versionNumber: Int!
	userGroupIds: [ID!]!
}

input UpdateStaticUserRolloutInput {
	appId: ID!
	versionNumber: Int!
	userGroupIds: [ID!]!
}

input CreateTimeRangeUserRolloutInput {
	versionNumber: Int!
	startAt: Time
	endAt: Time
	userGroupIds: [ID!]!
}

input UpdateTimeRangeRolloutInput {
	appId: ID!
	versionNumber: Int!
	startAt: Time
	endAt: Time
	userGroupIds: [ID!]!
}

input CreateExperimentUserRolloutInput {
	versionNumbers: [Int!]!
	startAt: Time
	endAt: Time
	userGroupIds: [ID!]!
}

input UpdateExperimentUserRolloutInput {
	appId: ID!
	versionNumbers: [Int!]!
	startAt: Time
	endAt: Time
	userGroupIds: [ID!]!
}

input CreateStaticTeamRolloutInput {
	versionNumber: Int!
	teamGroupIds: [ID!]!
}

input UpdateStaticTeamRolloutInput {
	appId: ID!
	versionNumber: Int!
	teamGroupIds: [ID!]!
}

input CreateTimeRangeTeamRolloutInput {
	versionNumber: Int!
	startAt: Time
	endAt: Time
	teamGroupIds: [ID!]!
}

input UpdateTimeRangeTeamRolloutInput {
	appId: ID!
	versionNumber: Int!
	startAt: Time
	endAt: Time
	teamGroupIds: [ID!]!
}

input CreateExperimentTeamRolloutInput {
	versionNumbers: [Int!]!
	startAt: Time
	endAt: Time
	teamGroupIds: [ID!]!
}

input UpdateExperimentTeamRolloutInput {
	appId: ID!
	versionNumbers: [Int!]!
	startAt: Time
	endAt: Time
	teamGroupIds: [ID!]!
}

enum InvitationStatus {
	PENDING
	ACCEPTED
	DECLINED
	EXPIRED
}

enum TaskAction {
	START
	DELETE
	ASSIGN_OWNER
	REPORT_BLOCKED
	MARK_COMPLETE
}

enum TaskStatus {
	TODO
	IN_PROGRESS
	PAUSED
	AWAITING
	BLOCK
	DELIVERED
}

enum Currency {
	USD
}

enum GroupType {
	STATIC
	FILTER
}

enum RolloutType {
	STATIC
	TIME_RANGE
	EXPERIMENT
}

scalar Duration

scalar Time
