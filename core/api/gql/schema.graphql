schema {
	query: Query
	mutation: Mutation
}

type Query {
	me: User!
	tasks(filter: TaskFilter): [Task!]!
	teams(filter: TeamFilter): [Team!]!
	invitations(filter: InvitationFilter): [Invitation!]!
	sprints(filter: SprintFilter): [Sprint!]!
	apps(filter: AppFilter): [App!]!
}

type Mutation {
	# Task
	createTask(teamId: ID!, task: CreateTaskInput!): Task!
	updateTask(taskId: ID!, input: UpdateTaskInput!): Task!
	deleteTask(taskId: ID!): Task!
	moveTaskToUpcoming(taskId: ID!): Task!
	moveTaskToInProgress(taskId: ID!): Task!
	moveTaskToDelivered(taskId: ID!): Task!
	moveTaskToBlocked(taskId: ID!, reason: String!): Task!
	addAwaitForTask(taskId: ID!, awaitForTaskId: ID!): Task!
	removeAwaitForTask(taskId: ID!, awaitForTaskId: ID!): Task!
	startDraggingTask(taskId: ID!, clientId: ID!): ID!
	stopDraggingTask(taskId: ID!, clientId: ID!): ID!

	# Message
	createMessage(threadId: ID!, message: CreateMessageInput!): Message!
	updateMessage(messageId: ID!, input: UpdateMessageInput!): Message!
	deleteMessage(messageId: ID!): Message!

	# Team
	createTeam(team: CreateTeamInput!): Team!
	updateTeam(teamId: ID!, input: UpdateTeamInput!): Team!
	updateTeamActiveSprint(teamId: ID!, sprintId: ID!): Team!
	createTeamIconUploadSession(teamId: ID!): ID!
	finishTeamIconUploadSession(teamId: ID!, fileUploadSessionId: ID!): Team!
	addMemberToTeam(teamId: ID!, memberUserId: ID!): TeamMember!
	updateTeamMember(teamId: ID!, input: UpdateTeamMemberInput!): TeamMember!
	removeMemberFromTeam(teamId: ID!, memberUserId: ID!): TeamMember!
	deleteTeam(teamId: ID!): Team!

	# User
	createUser(user: CreateUserInput!): User!
	updateUser(userId: ID!, input: UpdateUserInput!): User!
	createUserProfileUploadSession: ID!
	finishUserProfileUploadSession(fileUploadSessionId: ID!): User!

	# Invitation
	createInvitation(
		teamId: ID!
		invitation: CreateInvitationInput!
	): Invitation!
	updateInvitation(
		invitationId: ID!
		input: UpdateInvitationInput!
	): Invitation!
	acceptInvitation(invitationId: ID!, invitationCode: String!): Invitation!
	declineInvitation(invitationId: ID!, invitationCode: String!): Invitation!
	deleteInvitation(invitationId: ID!): Invitation!

	# Sprint
	createSprint(teamId: ID!, sprint: CreateSprintInput!): Sprint!
	deleteSprint(sprintId: ID!): Sprint!
	addTaskToSprint(sprintId: ID!, taskId: ID!): Task!
	removeTaskFromSprint(sprintId: ID!, taskId: ID!): Task!
	moveTasksToSprint(
		fromSprintId: ID!
		toSprintId: ID!
		taskIds: [ID!]!
	): [Task!]!
	copyTasksToSprint(toSprintId: ID!, taskIds: [ID!]!): [Task!]!

	# File
	createFileUploadSession(teamId: ID!): ID!
	finishFileUploadSession(fileUploadSessionId: ID!): FileMetadata!
	updateFileMetadata(fileId: ID!, input: FileMetadataInput!): FileMetadata!
	deleteFile(fileId: ID!): FileMetadata!

	# App
	createApp(teamId: ID!, input: CreateAppInput!): App!
	deleteApp(appId: ID!): App!

	# App Tag
	addTagToApp(appId: ID!, value: String!): Tag!
	removeTagFromApp(appId: ID!, tagId: ID!): Tag!

	installAppToTeam(appId: ID!, teamId: ID!): TeamAppInstallation!
	uninstallAppFromTeam(installationId: ID!): TeamAppInstallation!

	createAppSecret(appId: ID!, input: CreateAppSecretInput!): AppSecret!
	updateAppSecret(secretId: ID!, input: UpdateAppSecretInput!): AppSecret!
	deleteAppSecret(secretId: ID!): AppSecret!

	createAppVersion(appId: ID!): AppVersion!
	updateAppVersion(
		appId: ID!
		versionNumber: Int!
		input: UpdateAppVersionInput!
	): AppVersion!

	createAppPackageUploadSession(appId: ID!, versionNumber: Int!): ID!
	finishAppPackageUploadSession(
		appId: ID!
		versionNumber: Int!
		fileUploadSessionId: ID!
	): AppVersion!
	deleteAppVersion(appId: ID!, versionNumber: Int!): AppVersion!

	createStaticUserGroup(
		appId: ID!
		input: CreateStaticUserGroupInput!
	): StaticUserGroup!
	createStaticTeamGroup(
		appId: ID!
		input: CreateStaticTeamGroupInput!
	): StaticTeamGroup!
	createFilterGroup(appId: ID!, input: CreateFilterGroupInput!): FilterGroup!
	updateGroup(appId: ID!, groupId: ID!, input: UpdateGroupInput!): Group!

	deleteGroup(groupId: ID!): Group!

	createStaticActivator: StaticActivator!
	createTimeRangeActivator(
		input: CreateTimeRangeActivatorInput!
	): TimeRangeActivator!
	createMaxViewersActivator(
		input: CreateMaxViewersActivatorInput!
	): MaxViewersActivator!
	createPercentageActivator(
		input: CreatePercentageActivatorInput!
	): PercentageActivator!
	updateActivator(activatorId: ID!, input: UpdateActivatorInput!): Activator!
	deleteActivator(activatorId: ID!): Activator!

	createStaticVersionSelector(
		appId: ID!
		input: CreateStaticVersionSelectorInput!
	): StaticVersionSelector!
	createExperimentVersionSelector(
		appId: ID!
		input: CreateExperimentVersionSelectorInput!
	): ExperimentVersionSelector!
	updateVersionSelector(
		appId: ID!
		versionSelectorId: ID!
		input: UpdateVersionSelectorInput!
	): VersionSelector!
	deleteVersionSelector(versionSelectorId: ID!): VersionSelector!

	createAppRollout(
		appId: ID!
		appRolloutType: AppRolloutType!
		input: CreateAppRolloutInput!
	): Rollout!
	updateRollout(rolloutId: ID!, input: UpdateRolloutInput!): Rollout!
	deleteRollout(rolloutId: ID!): Rollout!

	createProject(input: CreateProjectInput!): Project!
	updateProject(projectId: ID!, input: UpdateProjectInput!): Project!
	deleteProject(projectId: ID!): Project!

	createStory(projectId: ID!, input: CreateStoryInput!): Story!
	updateStory(storyId: ID!, input: UpdateStoryInput!): Story!
	addTaskToStory(storyId: ID!, taskId: ID!): Story!
	removeTaskFromStory(storyId: ID!, taskId: ID!): Story!
	deleteStory(storyId: ID!): Story!

	createPhase(projectId: ID!, input: CreatePhaseInput!): Phase!
	updatePhase(phaseId: ID!, input: UpdatePhaseInput!): Phase!
	addStoryToPhase(phaseId: ID!, storyId: ID!): Phase!
	removeStoryFromPhase(phaseId: ID!, storyId: ID!): Phase!
}

type Project {
	id: ID!
	name: String!
	expectedStartAt: Time
	actualStartAt: Time
	expectedEndAt: Time
	actualEndAt: Time
	creator: User!
	createdAt: Time!
	updatedAt: Time
	phases: [Phase!]!
	stories: [Story!]!
}

type Phase {
	id: ID!
	name: String!
	status: PhaseStatus!
	expectedStartAt: Time!
	actualStartAt: Time
	expectedEndAt: Time!
	actualEndAt: Time
	creator: User!
	createdAt: Time!
	updatedAt: Time
	stories: [Story!]!
}

type Story {
	id: ID!
	name: String!
	owner: User!
	status: StoryStatus!
	priority: Priority
	creator: User!
	createdAt: Time!
	updatedAt: Time
	tasks: [Task!]!
}

type Task {
	id: ID!
	goal: String!
	context: String
	creator: User!
	owner: User
	owningTeam: Team!
	status: TaskStatus!
	isPlanned: Boolean!
	comments: Thread!
	createdAt: Time!
	updatedAt: Time
	deliveredAt: Time
	dueAt: Time
	effort: Duration
	priority: Priority
	availableActions: [TaskAction!]!
	awaitForTasks: [Task!]!
	links: [TaskLink!]!
}

type TaskLink {
	id: ID!
	taskId: ID!
	title: String!
	url: String!
	iconUrl: String
	iconHoverUrl: String
	createdAt: Time!
	updatedAt: Time
}

type Message {
	id: ID!
	body: String!
	author: User!
	thread: Thread!
	createdAt: Time!
	updatedAt: Time
}

type Thread {
	id: ID!
	messages: [Message!]!
}

type Sprint {
	id: ID!
	startAt: Time!
	endAt: Time!
	owningTeam: Team!
	tasks(filter: TaskFilter): [Task!]!
	createdAt: Time!
	participants: [SprintParticipant!]!
}

type SprintParticipant {
	sprint: Sprint!
	user: User!
	totalBandwidth: Duration!
	unusedBandwidth: Duration!
	createdAt: Time!
	updatedAt: Time
}

type Team {
	id: ID!
	name: String!
	iconUrl: String
	createdAt: Time!
	creator: User!
	owner: User!
	members: [TeamMember!]!
	tasks(filter: TaskFilter): [Task!]!
	invitations(filter: InvitationFilter): [Invitation!]!
	sprints(filter: SprintFilter): [Sprint!]!
	appInstallations: [TeamAppInstallation!]!
	managedApps: [App!]!
	taskActivities: [TaskActivity!]!
	activeSprint: Sprint
}

type TeamMember {
	team: Team!
	user: User!
	weeklyBandwidth: Duration!
	createdAt: Time!
	updatedAt: Time
}

type TaskActivity {
	taskId: ID!
	dragTaskActivity: DragTaskActivity!
}

type DragTaskActivity {
	isDragging: Boolean!
	client: Client
}

type Client {
	id: ID!
	user: User!
}

type Invitation {
	id: ID!
	sender: User!
	receiverFirstName: String
	receiverLastName: String
	receiverEmail: String
	receiver: User
	joiningTeam: Team!
	expireAt: Time!
	createdAt: Time!
	updatedAt: Time
	status: InvitationStatus!
	code: String!
}

type FileMetadata {
	id: ID!
	name: String!
	createdAt: Time!
	lastModifiedAt: Time
	owningTeam: Team!
}

type User {
	id: ID!
	firstName: String!
	lastName: String!
	profileUrl: String
	createdAt: Time!
	updatedAt: Time
	teams(filter: TeamFilter): [Team!]!
}

type Rollout {
	id: ID!
	name: String!
	activator: Activator!
	versionSelector: VersionSelector!
	groupRolloutRelations: [GroupRolloutRelation!]!
	isEnabled: Boolean!
	locked: Boolean!
	createdAt: Time!
	updatedAt: Time
}

interface Activator {
	id: ID!
	type: ActivatorType!
	createdAt: Time!
	updatedAt: Time
}

type StaticActivator implements Activator {
	id: ID!
	type: ActivatorType!
	createdAt: Time!
	updatedAt: Time
}

type TimeRangeActivator implements Activator {
	id: ID!
	type: ActivatorType!
	startAt: Time
	endAt: Time
	createdAt: Time!
	updatedAt: Time
}

type MaxViewersActivator implements Activator {
	id: ID!
	type: ActivatorType!
	maxViewers: Int!
	createdAt: Time!
	updatedAt: Time
}

type PercentageActivator implements Activator {
	id: ID!
	type: ActivatorType!
	percentage: Int!
	createdAt: Time!
	updatedAt: Time
}

interface VersionSelector {
	id: ID!
	type: VersionSelectorType!
	createdAt: Time!
	updatedAt: Time
}

type StaticVersionSelector implements VersionSelector {
	id: ID!
	type: VersionSelectorType!
	versionNumber: Int!
	createdAt: Time!
	updatedAt: Time
}

type ExperimentVersionSelector implements VersionSelector {
	id: ID!
	type: VersionSelectorType!
	versionNumbers: [Int!]!
	createdAt: Time!
	updatedAt: Time
}

type App {
	id: ID!
	secrets: [AppSecret!]!
	totalInstallations: Int!
	installations: [TeamAppInstallation!]!
	versions: [AppVersion!]!
	groups: [Group!]!
	userRollouts: [Rollout!]!
	teamRollouts: [Rollout!]!
	managedByTeam: Team!
	latestVersionForTeam(teamId: ID!): AppVersion
	tags: [Tag!]!
}

type Tag {
	id: ID!
	value: String!
}

type AppSecret {
	id: ID!
	name: String!
	token: String
	addedAt: Time!
	addedBy: User!
	lastUsedAt: Time
	app: App!
}

type AppVersion {
	number: Int!
	appName: String!
	description: String!
	hasUiExtension: Boolean!
	changes: [AppVersionChange!]!
	createdAt: Time!
	createdBy: User!
	prices: [Money!]!
	status: AppVersionStatus!
	app: App!
	locked: Boolean!
	errorMessage: String
}

type AppVersionChange {
	id: ID!
	appVersion: AppVersion!
	change: String!
}

interface GroupRolloutRelation {
	group: Group!
	rollout: Rollout!
	orderIndex: Int!
}

interface Group {
	id: ID!
	type: GroupType!
	memberType: GroupMemberType!
	maxRolloutIndex: Int!
	name: String!
	createdAt: Time!
	updatedAt: Time
	groupRolloutRelations: [GroupRolloutRelation!]!
	apps: [App!]!
	locked: Boolean!
}

type StaticUserGroup implements Group {
	id: ID!
	type: GroupType!
	memberType: GroupMemberType!
	maxRolloutIndex: Int!
	name: String!
	users: [User!]!
	createdAt: Time!
	updatedAt: Time
	groupRolloutRelations: [GroupRolloutRelation!]!
	apps: [App!]!
	locked: Boolean!
}

type StaticTeamGroup implements Group {
	id: ID!
	type: GroupType!
	memberType: GroupMemberType!
	maxRolloutIndex: Int!
	name: String!
	teams: [Team!]!
	createdAt: Time!
	updatedAt: Time
	groupRolloutRelations: [GroupRolloutRelation!]!
	apps: [App!]!
	locked: Boolean!
}

type FilterGroup implements Group {
	id: ID!
	type: GroupType!
	memberType: GroupMemberType!
	maxRolloutIndex: Int!
	name: String!
	filter: String!
	createdAt: Time!
	updatedAt: Time
	groupRolloutRelations: [GroupRolloutRelation!]!
	apps: [App!]!
	locked: Boolean!
}

type TeamAppInstallation {
	id: ID!
	installedTeam: Team!
	activeAppVersion: AppVersion
}

type Money {
	currency: Currency!
	amount: Int!
}

# Filters
input TaskFilter {
	taskId: ID
	ownerId: ID
	goalContains: String
	status: TaskStatus
	isPlanned: Boolean
}

input TeamFilter {
	teamId: ID
}

input InvitationFilter {
	invitationId: ID
	code: String
}

input SprintFilter {
	sprintId: ID
	startAtAndAfter: Time
	sortByStartAt: Boolean
	countLimit: Int
}

input AppFilter {
	query: String
	tagValues: [String!]!
	isOnPromotion: Boolean
}

# Inputs
input CreateProjectInput {
	name: String!
	expectedStartAt: Time
	expectedEndAt: Time
}

input UpdateProjectInput {
	name: String!
	expectedStartAt: Time
	actualStartAt: Time
	expectedEndAt: Time
	actualEndAt: Time
}

input CreatePhaseInput {
	name: String!
	expectedStartAt: Time!
	expectedEndAt: Time!
}

input UpdatePhaseInput {
	name: String!
	expectedStartAt: Time!
	actualStartAt: Time
	expectedEndAt: Time!
	actualEndAt: Time
	status: PhaseStatus!
}

input CreateStoryInput {
	name: String!
	ownerId: ID!
	priority: Priority!
}

input UpdateStoryInput {
	name: String!
	ownerId: ID!
	status: StoryStatus!
	priority: Priority!
}

input CreateAppInput {
	name: String!
}

input CreateTaskInput {
	goal: String!
	context: String
	ownerUserId: ID
	dueAt: Time
	isPlanned: Boolean!
}

input UpdateTaskInput {
	goal: String!
	context: String
	ownerUserId: ID
	owningTeamId: ID!
	effort: Duration
	priority: Priority
	dueAt: Time
}

input CreateMessageInput {
	body: String!
}

input UpdateMessageInput {
	body: String!
}

input CreateTeamInput {
	name: String!
}

input UpdateTeamInput {
	name: String!
	ownerUserId: ID!
}

input UpdateTeamMemberInput {
	userId: ID!
	weeklyBandwidth: Duration!
}

input CreateUserInput {
	lastName: String!
	firstName: String!
	profileUrl: String
}

input UpdateUserInput {
	lastName: String!
	firstName: String!
}

input CreateInvitationInput {
	receiverFirstName: String
	receiverLastName: String
	receiverEmail: String
	expireAt: Time!
}

input UpdateInvitationInput {
	receiverFirstName: String
	receiverLastName: String
	expireAt: Time!
}

input CreateSprintInput {
	startAt: Time!
	endAt: Time!
}

input FileMetadataInput {
	name: String!
}

input UpdateAppVersionInput {
	status: AppVersionStatus!
}

input CreateAppSecretInput {
	name: String!
}

input UpdateAppSecretInput {
	name: String!
}

input CreateStaticUserGroupInput {
	name: String!
	userIds: [ID!]!
	rolloutIds: [ID!]!
}

input CreateFilterGroupInput {
	name: String!
	filter: String!
	groupMemberType: GroupMemberType!
	rolloutIds: [ID!]!
}

input CreateStaticTeamGroupInput {
	name: String!
	teamIds: [ID!]!
	rolloutIds: [ID!]!
}

input UpdateGroupInput {
	name: String!
	type: GroupType!
	rolloutIds: [ID!]!
	groupMemberType: GroupMemberType!
	memberIds: [ID!]!
	filter: String
}

input CreateTimeRangeActivatorInput {
	startAt: Time
	endAt: Time
}

input CreateMaxViewersActivatorInput {
	maxViewers: Int!
}

input CreatePercentageActivatorInput {
	percentage: Int!
}

input UpdateActivatorInput {
	type: ActivatorType!
	startAt: Time
	endAt: Time
	maxViewers: Int
	percentage: Int
}

input CreateAppRolloutInput {
	name: String!
	activatorId: ID!
	versionSelectorId: ID!
	isEnabled: Boolean!
	groupIds: [ID!]!
}

input UpdateRolloutInput {
	name: String!
	activatorId: ID!
	versionSelectorId: ID!
	isEnabled: Boolean!
	groupIds: [ID!]!
}

input CreateStaticVersionSelectorInput {
	versionNumber: Int!
}

input CreateExperimentVersionSelectorInput {
	versionNumbers: [Int!]!
}

input UpdateVersionSelectorInput {
	type: VersionSelectorType!
	versionNumber: Int
	versionNumbers: [Int!]!
}

enum InvitationStatus {
	PENDING
	ACCEPTED
	DECLINED
	EXPIRED
}

enum PhaseStatus {
	TODO
	IN_PROGRESS
	PAUSED
	COMPLETED
}

enum StoryStatus {
	TODO
	IN_PROGRESS
	PAUSED
	COMPLETED
}

enum TaskAction {
	START
	DELETE
	ASSIGN_OWNER
	REPORT_BLOCKED
	MARK_COMPLETE
}

enum TaskStatus {
	TODO
	IN_PROGRESS
	PAUSED
	AWAITING
	BLOCK
	DELIVERED
}

enum Priority {
	URGENT
	HIGH
	MEDIUM
	LOW
}

enum Currency {
	USD
}

enum GroupType {
	STATIC
	FILTER
}

enum GroupMemberType {
	USER
	TEAM
}

enum AppVersionStatus {
	INIT
	UPLOADING
	PROCESSING
	READY
	ERROR
}

enum AppRolloutType {
	USER
	TEAM
}

enum ActivatorType {
	STATIC
	TIME_RANGE
	MAX_VIEWERS
	PERCENTAGE
}

enum VersionSelectorType {
	STATIC
	EXPERIMENT
}

scalar Duration

scalar Time
