schema {
	query: Query
	mutation: Mutation
}

type Query {
	# tasks(input: [TaskFilter!]!): [Task!]!
    tasks(id: Int!): [Task!]!
    # users(input: [UserFilter!]!): [User!]!
    me: User!
}

type LifetimeEvent {
    eventType: LifetimeEventEventType!
    "who did it"
    actor:     User!
    happensAt: Time!
}

enum LifetimeEventEventType {
    creation
    change
    close
    archive
    delete
}

# enum TaskAction {
# 	START
# 	DELETE
# 	ASSIGN_OWNER
# 	REPORT_BLOCKED
# 	MARK_COMPLETE
# }

scalar Time


type User {
	# core information
    id: Int!
	name: String!
	profileUrl: String!
    """
    All tasks relates to this user, 
    be it a creator or assignee or commenter, or any kinds of participants, 
    sort by relevance.
    Relevance will be defined later.
    """
    tasks:             [Task!]!
    taskNeedAttention: Task
	upcomingTasks:     [Task!]!
	deliveredTasks:    [Task!]!
    # time flow
	# lifetimeEvents: [LifetimeEvent!]!
}

input UserInput {
    id: ID!
    "full text search patterns"
    name: String!
}
type Task {
	# core information
    id: Int!
	goal: String!    # is this title?
	context: String! # content?
    mentioned:  [Mentionable!]!
	creator: User!
    comments:  [Comment!]!
    "the owner or the person who is responsible of. Usually 1 primary owner and sometimes 2 owners."
    assignees: [User!]!
	dependsOn: [Task!]!
    # time flow
    # dueAt: Time
    # lifetimeEvents: [TaskLifetimeEvent!]!
}

# union TaskLifetimeEvent = TaskAction | LifetimeEvent

input TaskFilter {
    id: ID!
    "full text search patterns that searches across goal and context"
    content: String!
    "related user ids"
    relatedTo: [ID!]!
}

type Comment {
    commenter:  User!
    content:    String!
    mentioned:  [Mentionable!]!
}

"""
Mentionable is a backend computed value according to text content of task or comments
so that frontend doesn't need to compute is again.
"""
union Mentionable = User | Task


# mutation
type Mutation {
    CreateTask(input: TaskInput!): Task!
}

input TaskInput {
    goal: String!
    context: String
}
